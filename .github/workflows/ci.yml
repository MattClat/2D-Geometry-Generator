name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The geometry, curve-fitting and DXF suites need no dependencies.
      - name: Engine, fit and DXF tests
        run: npm test
      - name: Trim verification
        run: node tools/verify-trim.mjs
